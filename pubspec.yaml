name: honeynotify
description: HoneyNotify device registration and notification lifecycle SDK for Flutter.
version: 0.1.0
homepage: https://honeynotify.com
repository: https://github.com/HoneyNotify/flutter-sdk
issue_tracker: https://github.com/HoneyNotify/flutter-sdk/issues

topics:
  - push-notifications
  - notifications
  - firebase
  - apns

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  firebase_messaging: '>=15.0.0 <17.0.0'
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
